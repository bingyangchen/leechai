services:
  reverseproxy:
    image: nginx:1.29.6-alpine-slim
    volumes:
      - ./reverseproxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/certs/cloudflare-cert.pem:/etc/ssl/certs/cloudflare-cert.pem:ro
      - /etc/ssl/certs/cloudflare-private-key.pem:/etc/ssl/certs/cloudflare-private-key.pem:ro
    depends_on:
      - apiserver
    restart: unless-stopped
    user: root
    ports:
      - "80:80"
      - "443:443"
    command: ["nginx", "-g", "daemon off;"]

  apiserver:
    image: leechaiapp/apiserver:prod
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    command:
      ["fastapi", "run", "main/main.py", "--host", "0.0.0.0", "--port", "8000"]

  db:
    image: postgres:18.1-alpine
    volumes:
      - db_data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: leechai
      PGDATABASE: leechai
      PGUSER: postgres
      PGPASSWORD: password
    restart: unless-stopped

volumes:
  db_data:
