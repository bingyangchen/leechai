name: mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^1.1.1
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.1
  intl: ^0.19.0
  path: ^1.9.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.0.5
  in_app_review: ^2.0.11
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  names_launcher: ^0.0.2
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

names_launcher:
  name: "Leechai"
  platforms:
    android:
      enable: true
    ios:
      enable: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
