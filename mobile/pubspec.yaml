name: mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  names_launcher: ^0.0.2

flutter:
  uses-material-design: true

# Launcher name（各平台 app 顯示名稱），改這裡後執行: dart run names_launcher:change
names_launcher:
  name: "Leechai"
  platforms:
    android:
      enable: true
    ios:
      enable: true
    macos:
      enable: true
    web:
      enable: true
    linux:
      enable: true
    windows:
      enable: true
